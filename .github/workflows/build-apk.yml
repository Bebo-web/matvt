name: Build Android APK
on:
  push:
    branches:
      - master
      - feature/smaller-cursor-drag-drop
      - poc/shizuku-input-test
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Build APKs
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: matvt-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: shizuku-input-tester-debug
          path: inputtester/build/outputs/apk/debug/inputtester-debug.apk
          if-no-files-found: error
          retention-days: 14
